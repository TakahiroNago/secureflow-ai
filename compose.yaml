# SecureFlow AI — local development stack
# Image versions are pinned; see README "採用バージョン".
#
# Networks:
#   data : postgres / redis only + PHP services. internal (no host access, no outbound route).
#   web  : nginx <-> php-fpm. nginx publishes 127.0.0.1:8080 only.
#
# DB credentials:
#   app / worker / scheduler -> application role only (DML)
#   migrate / test (profile "tools") -> additionally the owner role (DDL)
name: ${COMPOSE_PROJECT_NAME:-secureflow}

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped

x-php-build: &php-build
  context: .
  dockerfile: docker/php/Dockerfile
  target: dev
  args:
    UID: ${HOST_UID:-1000}
    GID: ${HOST_GID:-1000}

# Runtime environment for Laravel. Owner-role credentials are deliberately absent.
x-laravel-env: &laravel-env
  APP_NAME: SecureFlowAI
  APP_ENV: ${APP_ENV:-local}
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_KEY: ${APP_KEY:?}
  APP_URL: ${APP_URL:-http://localhost:8080}
  LOG_CHANNEL: stderr
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_DATABASE: ${DB_DATABASE:?set DB_DATABASE in .env}
  DB_USERNAME: ${DB_USERNAME:?set DB_USERNAME in .env}
  DB_PASSWORD: ${DB_PASSWORD:?}
  REDIS_CLIENT: phpredis
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ${REDIS_PASSWORD:?}
  SESSION_DRIVER: redis
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  AI_PROVIDER: mock

x-php-service: &php-service
  <<: *hardening
  image: secureflow-php:dev
  build: *php-build
  volumes:
    - ./backend:/var/www/html
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    <<: *hardening
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: postgres
      # consumed only by docker/postgres/initdb/01-roles.sh on first start
      DB_DATABASE: ${DB_DATABASE:?set DB_DATABASE in .env}
      DB_TEST_DATABASE: ${DB_TEST_DATABASE:?set DB_TEST_DATABASE in .env}
      DB_USERNAME: ${DB_USERNAME:?set DB_USERNAME in .env}
      DB_PASSWORD: ${DB_PASSWORD:?}
      DB_MIGRATOR_USERNAME: ${DB_MIGRATOR_USERNAME:?set DB_MIGRATOR_USERNAME in .env}
      DB_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres -h 127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  redis:
    <<: *hardening
    image: redis:8.10.3-alpine3.23
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    # The password is written to a tmpfs config file instead of the command line,
    # so it does not appear in `docker inspect` args or the process list.
    command:
      - sh
      - -c
      - |
        umask 077
        printf 'requirepass %s\nprotected-mode yes\nappendonly no\n' "$$REDIS_PASSWORD" > /run/redis/redis.conf
        exec redis-server /run/redis/redis.conf
    tmpfs:
      - /run/redis:uid=999,gid=1000,mode=0700
    user: "999:1000"
    volumes:
      - redisdata:/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    <<: *php-service
    environment:
      <<: *laravel-env
    networks: [data, web]
    healthcheck:
      # Liveness of php-fpm (TCP accept on :9000). HTTP-level checks go through nginx.
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s

  worker:
    <<: *php-service
    environment:
      <<: *laravel-env
    command: ["php", "artisan", "queue:work", "redis", "--sleep=3", "--tries=1", "--max-time=3600"]
    networks: [data]

  scheduler:
    <<: *php-service
    environment:
      <<: *laravel-env
    command: ["php", "artisan", "schedule:work"]
    networks: [data]

  nginx:
    <<: *hardening
    image: nginx:1.30.6-alpine3.24
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/snippets:/etc/nginx/snippets:ro
      # Built SPA. Run `npm run build` first (see README); compose fails instead of
      # creating a root-owned empty directory when it does not exist.
      - type: bind
        source: ./frontend/dist
        target: /usr/share/nginx/html
        read_only: true
        bind:
          create_host_path: false
    networks: [web]
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 10

  # Vite dev server (hot reload). Proxies /api and /sanctum to nginx (same-origin).
  frontend:
    <<: *hardening
    image: node:24.22.2-alpine3.24
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /app
    environment:
      VITE_PROXY_TARGET: http://nginx
      npm_config_cache: /tmp/npm
      npm_config_update_notifier: "false"
      npm_config_fund: "false"
    command: ["npm", "run", "dev"]
    volumes:
      - ./frontend:/app
    ports:
      - "127.0.0.1:5173:5173"
    networks: [web]
    depends_on:
      nginx:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 3s
      retries: 10

  # ---- tools (run on demand; not started by `docker compose up`) -------------
  # Migrations: the ONLY service that receives the owner-role credentials for the dev DB.
  migrate:
    <<: *php-service
    profiles: [tools]
    restart: "no"
    environment:
      <<: *laravel-env
      DB_MIGRATOR_USERNAME: ${DB_MIGRATOR_USERNAME:?set DB_MIGRATOR_USERNAME in .env}
      DB_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD:?}
    command: ["php", "artisan", "migrate", "--database=pgsql_migrator", "--force"]
    networks: [data]

  # Test runner: test database only. Schema is built with the owner role,
  # test queries run with the application role (docs/test-strategy.md).
  test:
    <<: *php-service
    profiles: [tools]
    restart: "no"
    environment:
      <<: *laravel-env
      APP_ENV: testing
      DB_DATABASE: ${DB_TEST_DATABASE:?set DB_TEST_DATABASE in .env}
      DB_MIGRATOR_USERNAME: ${DB_MIGRATOR_USERNAME:?set DB_MIGRATOR_USERNAME in .env}
      DB_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD:?}
    command: ["php", "vendor/bin/pest"]
    networks: [data]

networks:
  data:
    internal: true
  web:

volumes:
  pgdata:
  redisdata:
