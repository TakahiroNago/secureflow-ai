# SecureFlow AI — local development stack
# Image versions are pinned; see README "採用バージョン".
# DB and Redis are attached only to the internal "data" network and are NOT published to the host.
name: ${COMPOSE_PROJECT_NAME:-secureflow}

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped

services:
  postgres:
    <<: *hardening
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: postgres
      # consumed only by docker/postgres/initdb/01-roles.sh on first start
      DB_DATABASE: ${DB_DATABASE:?set DB_DATABASE in .env}
      DB_TEST_DATABASE: ${DB_TEST_DATABASE:?set DB_TEST_DATABASE in .env}
      DB_USERNAME: ${DB_USERNAME:?set DB_USERNAME in .env}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      DB_MIGRATOR_USERNAME: ${DB_MIGRATOR_USERNAME:?set DB_MIGRATOR_USERNAME in .env}
      DB_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD:?set DB_MIGRATOR_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres -h 127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  redis:
    <<: *hardening
    image: redis:8.10.3-alpine3.23
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    # The password is written to a tmpfs config file instead of the command line,
    # so it does not appear in `docker inspect` args or the process list.
    command:
      - sh
      - -c
      - |
        umask 077
        printf 'requirepass %s\nprotected-mode yes\nappendonly no\n' "$$REDIS_PASSWORD" > /run/redis/redis.conf
        exec redis-server /run/redis/redis.conf
    tmpfs:
      - /run/redis:uid=999,gid=1000,mode=0700
    user: "999:1000"
    volumes:
      - redisdata:/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

networks:
  # internal: no route to the outside world and not reachable from the host
  data:
    internal: true

volumes:
  pgdata:
  redisdata:
