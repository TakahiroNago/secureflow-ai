name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Scanner and toolchain images are pinned by version AND digest.
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
  TRIVY_IMAGE: aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
  SEMGREP_IMAGE: semgrep/semgrep:1.183.0@sha256:2e45517a85e13a9cca14a2a00df6bb48affd66b8ebfae1b0991cd57578362fb0
  TERRAFORM_IMAGE: hashicorp/terraform:1.17.1@sha256:a5d5a5a892c98f60fcbfa81eac2a40fc19e7b3fa7719bccae10ff6111d22524a
  NODE_IMAGE: node:24.22.2-alpine3.24
  PHP_IMAGE: secureflow-php:dev
  # The browsers of e2e/package.json's @playwright/test version (scripts/test-e2e.sh).
  PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.56.1-noble@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a

jobs:
  secret-scan:
    name: Secret scan (gitleaks / trivy)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for gitleaks
          persist-credentials: false

      - name: gitleaks (entire git history)
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD":/repo -w /repo "$GITLEAKS_IMAGE" \
            git /repo --no-banner --redact --exit-code 1 --verbose

      - name: trivy (secret scan of the working tree)
        run: |
          docker run --rm -v "$PWD":/src:ro "$TRIVY_IMAGE" \
            fs --scanners secret --exit-code 1 --no-progress /src

  backend:
    name: Backend (Pint / Larastan / Pest / composer audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create CI-only .env (random throwaway secrets)
        run: bash scripts/init-env.sh

      - name: Tuning variables reach the containers
        run: bash scripts/test-compose-env.sh

      - name: Build PHP image
        run: docker compose build app

      - name: composer install
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -e COMPOSER_HOME=/tmp/composer \
            -v "$PWD/backend":/var/www/html -w /var/www/html "$PHP_IMAGE" \
            composer install --no-interaction --prefer-dist --no-progress

      - name: composer audit
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -e COMPOSER_HOME=/tmp/composer \
            -v "$PWD/backend":/var/www/html -w /var/www/html "$PHP_IMAGE" \
            composer audit --locked

      - name: Start PostgreSQL and Redis
        run: docker compose up -d --wait postgres redis

      - name: Infrastructure checks (roles, ports, redis auth)
        run: bash scripts/verify-infra.sh

      - name: Pint
        run: docker compose run --rm --no-deps -T test php vendor/bin/pint --test

      - name: Larastan
        run: docker compose run --rm --no-deps -T test php vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Pest with coverage (owner role builds schema, app role runs tests)
        run: docker compose run --rm -T test php -d memory_limit=1G vendor/bin/pest --colors=never --coverage --coverage-clover=coverage.xml

      # docs/test-strategy.md §3: app/Security and app/Domain 90%, the backend 80% (COV-01).
      - name: Line coverage against the targets
        run: python3 scripts/check-coverage.py backend/coverage.xml --summary "$GITHUB_STEP_SUMMARY"

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans

  frontend:
    name: Frontend (ESLint / tsc / Vitest / build / npm audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: npm ci
        run: |
          docker run --rm -u "$(id -u):$(id -g)" \
            -e npm_config_cache=/tmp/npm -e npm_config_update_notifier=false -e npm_config_fund=false \
            -v "$PWD/frontend":/app -w /app "$NODE_IMAGE" npm ci --no-audit

      - name: ESLint
        run: docker run --rm -u "$(id -u):$(id -g)" -v "$PWD/frontend":/app -w /app "$NODE_IMAGE" npm run lint

      - name: Type check
        run: docker run --rm -u "$(id -u):$(id -g)" -v "$PWD/frontend":/app -w /app "$NODE_IMAGE" npm run typecheck

      # docs/test-strategy.md §3: 70% of lines, enforced by the coverage thresholds in vite.config.ts (COV-02).
      - name: Vitest with coverage
        run: docker run --rm -u "$(id -u):$(id -g)" -v "$PWD/frontend":/app -w /app "$NODE_IMAGE" npm run test:coverage

      - name: Build
        run: docker run --rm -u "$(id -u):$(id -g)" -v "$PWD/frontend":/app -w /app "$NODE_IMAGE" npm run build

      - name: npm audit
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -e npm_config_cache=/tmp/npm \
            -v "$PWD/frontend":/app -w /app "$NODE_IMAGE" npm audit

  stack:
    name: Full stack (compose up + verify-infra)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create CI-only .env (random throwaway secrets)
        run: bash scripts/init-env.sh

      - name: Build PHP image
        run: docker compose build app

      - name: composer install
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -e COMPOSER_HOME=/tmp/composer \
            -v "$PWD/backend":/var/www/html -w /var/www/html "$PHP_IMAGE" \
            composer install --no-interaction --prefer-dist --no-progress

      - name: Frontend install and build
        run: |
          docker run --rm -u "$(id -u):$(id -g)" \
            -e npm_config_cache=/tmp/npm -e npm_config_update_notifier=false -e npm_config_fund=false \
            -v "$PWD/frontend":/app -w /app "$NODE_IMAGE" sh -c 'npm ci --no-audit && npm run build'

      - name: docker compose up
        run: docker compose up -d --wait

      - name: Run migrations (owner role, migrate service)
        run: docker compose run --rm -T migrate

      - name: Verify stack (P0-DB / P0-NET / P0-HC / P0-FE)
        run: bash scripts/verify-infra.sh

      - name: Authentication over real HTTP (sessions in Redis, CSRF, lock, rate limit)
        run: bash scripts/test-auth-flow.sh

      - name: An analysis and an edit over real HTTP, with the real worker
        run: bash scripts/test-workflow-flow.sh

      - name: What nginx answers by itself, and the headers
        run: bash scripts/test-nginx-errors.sh

      - name: Published port policy negative tests (P0-NET-01)
        run: bash scripts/test-published-ports.sh

      - name: App healthcheck negative tests
        run: bash scripts/test-app-healthcheck.sh

      - name: Worker and scheduler healthcheck negative tests
        run: bash scripts/test-worker-healthcheck.sh

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans

  # The public environment stack, as compose.prod.yaml runs the images of the release workflow (docs/test-strategy.md §36).
  prod-stack:
    name: Production stack (compose.prod + test-prod-stack)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the production images
        run: |
          docker build --target prod -t secureflow-php:prod -f docker/php/Dockerfile .
          docker build -t secureflow-web:prod -f docker/nginx/Dockerfile .

      - name: Create CI-only .env (random throwaway secrets) with the production variables
        run: |
          bash scripts/init-env.sh
          cat >> .env <<EOF
          SECUREFLOW_PHP_IMAGE=secureflow-php:prod
          SECUREFLOW_WEB_IMAGE=secureflow-web:prod
          PUBLIC_HOST=localhost:8080
          TRUSTED_PROXY_CIDR=127.0.0.1/32
          EOF
          sed -i -e 's/^COMPOSE_PROJECT_NAME=.*/COMPOSE_PROJECT_NAME=secureflow-prod-ci/' -e 's|^APP_URL=.*|APP_URL=http://localhost:8080|' -e 's/^APP_ENV=.*/APP_ENV=production/' .env

      - name: Start the production stack
        run: docker compose -f compose.prod.yaml up -d --wait

      - name: Run migrations (owner role, migrate service)
        run: docker compose -f compose.prod.yaml run --rm -T migrate

      - name: The production stack as it will run (PROD-01 to PROD-06)
        run: bash scripts/test-prod-stack.sh

      - name: Logs on failure
        if: failure()
        run: docker compose -f compose.prod.yaml logs --no-color

      - name: Tear down
        if: always()
        run: docker compose -f compose.prod.yaml down -v --remove-orphans

  # The real screens in real browsers against the whole stack (docs/test-strategy.md §10, §33).
  infra:
    name: Infrastructure (terraform fmt / validate / filters)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The module is formatted, parses, and its references resolve. No credentials: nothing is planned or applied
      # (docs/test-strategy.md §37, INFRA-03). The misconfiguration scan of infra/aws is in the sast-sca job.
      - name: terraform fmt
        run: docker run --rm -v "$PWD/infra/aws":/work -w /work "$TERRAFORM_IMAGE" fmt -check -diff -recursive

      - name: terraform validate
        run: |
          docker run --rm -v "$PWD/infra/aws":/work -w /work "$TERRAFORM_IMAGE" init -backend=false -input=false -no-color
          docker run --rm -v "$PWD/infra/aws":/work -w /work "$TERRAFORM_IMAGE" validate -no-color

      # The log filters' samples, patterns and the code that writes the lines agree (INFRA-01).
      - name: metric-filters.json against the code
        run: python3 scripts/check-metric-filters.py

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create CI-only .env (random throwaway secrets)
        run: bash scripts/init-env.sh

      - name: Build PHP image
        run: docker compose build app

      - name: composer install
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -e COMPOSER_HOME=/tmp/composer \
            -v "$PWD/backend":/var/www/html -w /var/www/html "$PHP_IMAGE" \
            composer install --no-interaction --prefer-dist --no-progress

      - name: Frontend install and build
        run: |
          docker run --rm -u "$(id -u):$(id -g)" \
            -e npm_config_cache=/tmp/npm -e npm_config_update_notifier=false -e npm_config_fund=false \
            -v "$PWD/frontend":/app -w /app "$NODE_IMAGE" sh -c 'npm ci --no-audit && npm run build'

      - name: Type-check the suite
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp -e npm_config_cache=/tmp/npm \
            -v "$PWD/e2e":/work -w /work "$PLAYWRIGHT_IMAGE" sh -c 'npm ci --no-audit --no-fund && npx tsc --noEmit'

      - name: docker compose up
        run: docker compose up -d --wait

      - name: Run migrations (owner role, migrate service)
        run: docker compose run --rm -T migrate

      - name: Playwright (Chromium, Firefox, WebKit)
        run: bash scripts/test-e2e.sh

      # The screens as the browsers saw them, the report, and the traces of what failed.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-output
          path: e2e/output
          if-no-files-found: ignore

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans

  security:
    name: Security tests (Pest group security / corpus report)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create CI-only .env (random throwaway secrets)
        run: bash scripts/init-env.sh

      - name: Build PHP image
        run: docker compose build app

      - name: composer install
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -e COMPOSER_HOME=/tmp/composer \
            -v "$PWD/backend":/var/www/html -w /var/www/html "$PHP_IMAGE" \
            composer install --no-interaction --prefer-dist --no-progress

      - name: Start PostgreSQL and Redis
        run: docker compose up -d --wait postgres redis

      # ST-01 to ST-39 and the corpus gates, wherever their files live (docs/test-strategy.md §5, §31).
      - name: Security tests (Pest group security)
        run: docker compose run --rm -T test php vendor/bin/pest --colors=never --group security

      # The tuning and the hold-out rates side by side; the hold-out never counts as achieved (§7).
      - name: Corpus evaluation report
        run: |
          docker compose run --rm --no-deps -T test php artisan security:corpus-report --json=corpus-report.json \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: corpus-report
          path: backend/corpus-report.json

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans

  sast-sca:
    name: SAST / SCA (Semgrep / Trivy)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The rules fire on what they forbid and stay quiet on clean code (SAST-02).
      - name: Semgrep rule probes
        run: bash scripts/test-semgrep-rules.sh

      # Project rules only (.semgrep/secureflow.yml): nothing is fetched from a registry (SAST-01).
      - name: Semgrep
        run: |
          docker run --rm -v "$PWD":/src:ro -w /src "$SEMGREP_IMAGE" \
            semgrep scan --config /src/.semgrep/secureflow.yml --metrics=off --error \
            backend/app backend/routes backend/bootstrap backend/database backend/config frontend/src

      # Dependencies (composer.lock, package-lock.json), the Dockerfile and compose, secrets (SCA-01).
      - name: Trivy filesystem
        run: |
          docker run --rm -v "$PWD":/src:ro -v "$HOME/.cache/trivy":/root/.cache/trivy "$TRIVY_IMAGE" \
            fs --scanners vuln,misconfig,secret --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress \
            --ignorefile /src/.trivyignore.yaml /src

      - name: Create CI-only .env (random throwaway secrets)
        run: bash scripts/init-env.sh

      - name: Build PHP image
        run: docker compose build app

      - name: Build the production images
        run: |
          docker build --target prod -t secureflow-php:prod -f docker/php/Dockerfile .
          docker build -t secureflow-web:prod -f docker/nginx/Dockerfile .

      # The PHP image, the two production images and every pinned image compose uses, profiles included (SCA-01).
      # Every image is scanned before the step fails, so one finding does not hide the others.
      - name: Trivy images
        run: |
          failed=""
          for image in $(docker compose --profile openai --profile tools config --images | sort -u) secureflow-php:prod secureflow-web:prod; do
            echo "::group::$image"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$HOME/.cache/trivy":/root/.cache/trivy \
              -v "$PWD/.trivyignore.yaml":/.trivyignore.yaml:ro "$TRIVY_IMAGE" \
              image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress --ignorefile /.trivyignore.yaml "$image" \
              || failed="$failed $image"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::HIGH or CRITICAL vulnerabilities with a fix in:$failed"
            exit 1
          fi
