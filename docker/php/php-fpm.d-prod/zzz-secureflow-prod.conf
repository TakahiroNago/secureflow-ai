; SecureFlow AI — production pool overrides, loaded after zz-secureflow.conf (docs/security-design.md §22 A-3).
[www]
; A request whose database process no longer answers cannot be interrupted from inside PHP: statement_timeout
; runs on the server, keepalives succeed because the kernel still answers, and PDO waits (threat-model R-19).
; This ends the request from outside, so a worker is lost for 30 seconds at most instead of for the whole outage.
; It is shorter than nginx's fastcgi_read_timeout (60s), and nginx turns the broken answer into a 502 in RFC 9457
; form (docker/nginx/snippets/api-errors.conf). Not a replacement for the database timeouts: the connection is
; not closed cleanly and the request leaves no application log, only php-fpm's.
request_terminate_timeout = 30s
; The status page on a port of its own, answered by a separate process, so the healthcheck can still read it
; while every worker of the pool waits (docker/php/healthcheck-prod.sh). nginx never routes to it.
pm.status_listen = 127.0.0.1:9001
pm.status_path = /fpm-status
