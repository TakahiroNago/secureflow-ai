; SecureFlow AI — php-fpm pool overrides
; php-fpm runs as the non-root "app" user (container USER), so user/group directives are not used.
[global]
error_log = /proc/self/fd/2
log_limit = 8192

[www]
listen = 9000
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
; Do not leak the PHP version via X-Powered-By (expose_php = Off) and keep access log minimal
access.log = /dev/null
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
; Liveness probe for container healthcheck (php-fpm status ping, not exposed via nginx)
ping.path = /fpm-ping
ping.response = pong
