# SecureFlow AI — the only way out for the worker, and only to OpenAI (docs/security-design.md §6.1).
#
# It relays TCP. TLS stays between the worker and OpenAI, so this sees neither the key nor the text, and the worker
# still verifies OpenAI's real certificate. It only looks at the name the client asks for: any other name goes nowhere.
#
# On the data network this container answers to the name api.openai.com, so Docker's DNS would give its own address
# for that name. That is why the resolver below is a public one.

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 64;
}

stream {
    access_log off;

    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    resolver_timeout 5s;

    map $ssl_preread_server_name $ai_upstream {
        api.openai.com api.openai.com:443;
        default 127.0.0.1:9;
    }

    server {
        listen 443;
        ssl_preread on;
        preread_timeout 5s;
        proxy_connect_timeout 5s;
        # Above AI_TIMEOUT_SECONDS: the application decides when a call has taken too long.
        proxy_timeout 60s;
        proxy_pass $ai_upstream;
    }
}
