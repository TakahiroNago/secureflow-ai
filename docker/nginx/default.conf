# SecureFlow AI — nginx (reverse proxy for the Laravel API)
# Security headers are set at server level, in one snippet. A location with an add_header of its own includes the
# snippet again, because nginx would otherwise drop the inherited ones.

limit_req_zone $binary_remote_addr zone=health:1m rate=1r/s;   # 60 req/min per IP
limit_req_zone $binary_remote_addr zone=csrf:1m rate=1r/s;     # 60 req/min per IP: outside Laravel's route groups

upstream php_app {
    server app:9000;
}

# Container healthcheck endpoint: loopback-only listener on a port that is NOT published.
server {
    listen 127.0.0.1:8081;
    server_tokens off;
    access_log off;
    location = /nginx-health {
        default_type text/plain;
        return 200 "ok\n";
    }
    location / {
        return 404;
    }
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 2m;

    include /etc/nginx/snippets/security-headers.conf;

    # Hidden files are never served
    location ~ /\. {
        deny all;
        return 404;
    }

    # Unauthenticated health endpoints: rate limited here (not in Laravel) so that
    # readiness keeps answering even when Redis is down.
    location ^~ /api/health/ {
        limit_req zone=health burst=10 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/api-errors.conf;
        include /etc/nginx/snippets/laravel-fastcgi.conf;
    }

    location ^~ /api/ {
        include /etc/nginx/snippets/api-errors.conf;
        include /etc/nginx/snippets/laravel-fastcgi.conf;
    }

    location ^~ /sanctum/ {
        limit_req zone=csrf burst=30 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/api-errors.conf;
        include /etc/nginx/snippets/laravel-fastcgi.conf;
    }

    # What nginx itself answers, in the format of the API. Never reachable from outside.
    location ^~ /__problem/ {
        internal;
        return 404;
    }

    location = /__problem/413 {
        internal;
        default_type application/problem+json;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        return 413 '{"type":"https://secureflow.local/problems/payload-too-large","title":"Payload too large","status":413,"code":"PAYLOAD_TOO_LARGE","detail":"要求が大きすぎます。","trace_id":"$request_id"}';
    }

    location = /__problem/429 {
        internal;
        default_type application/problem+json;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "5" always;
        return 429 '{"type":"https://secureflow.local/problems/rate-limited","title":"Too many requests","status":429,"code":"RATE_LIMITED","detail":"しばらく待ってから再度お試しください。","trace_id":"$request_id"}';
    }

    location = /__problem/502 {
        internal;
        default_type application/problem+json;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "30" always;
        return 502 '{"type":"https://secureflow.local/problems/bad-gateway","title":"Bad gateway","status":502,"code":"BAD_GATEWAY","detail":"現在サービスを利用できません。しばらく待ってから再度お試しください。","trace_id":"$request_id"}';
    }

    location = /__problem/504 {
        internal;
        default_type application/problem+json;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "30" always;
        return 504 '{"type":"https://secureflow.local/problems/gateway-timeout","title":"Gateway timeout","status":504,"code":"GATEWAY_TIMEOUT","detail":"現在サービスを利用できません。しばらく待ってから再度お試しください。","trace_id":"$request_id"}';
    }


    # Frontend (built SPA from frontend/dist). Hashed assets are long-cached.
    root /usr/share/nginx/html;

    location ^~ /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
