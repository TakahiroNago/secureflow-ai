# SecureFlow AI — nginx (reverse proxy for the Laravel API)
# Security headers are set at server level only (no add_header inside locations,
# because nginx would then drop the inherited ones).

limit_req_zone $binary_remote_addr zone=health:1m rate=1r/s;   # 60 req/min per IP

upstream php_app {
    server app:9000;
}

# Container healthcheck endpoint: loopback-only listener on a port that is NOT published.
server {
    listen 127.0.0.1:8081;
    server_tokens off;
    access_log off;
    location = /nginx-health {
        default_type text/plain;
        return 200 "ok\n";
    }
    location / {
        return 404;
    }
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 2m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;

    # Hidden files are never served
    location ~ /\. {
        deny all;
        return 404;
    }

    # Unauthenticated health endpoints: rate limited here (not in Laravel) so that
    # readiness keeps answering even when Redis is down.
    location ^~ /api/health/ {
        limit_req zone=health burst=10 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/laravel-fastcgi.conf;
    }

    location ^~ /api/ {
        include /etc/nginx/snippets/laravel-fastcgi.conf;
    }

    location ^~ /sanctum/ {
        include /etc/nginx/snippets/laravel-fastcgi.conf;
    }

    # Frontend (SPA) is added in Phase 0-4
    location / {
        return 404;
    }
}
