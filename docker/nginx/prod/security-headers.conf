# SecureFlow AI — the production copy of docker/nginx/snippets/security-headers.conf (docs/security-design.md §15, §22 A-1).
# Identical to the development snippet plus HSTS, which only makes sense behind TLS: scripts/test-prod-stack.sh
# checks that the two files differ by that line alone, so they cannot drift apart.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
