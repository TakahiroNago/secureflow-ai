  # postgres:18.6-alpine3.24 (2026-11-06, the newest 18.x tag): gosu is a Go binary built with Go 1.24.6. Reviewed
  # 2026-11-07. gosu runs once at start and uses none of the affected packages' network paths.
  - id: CVE-2025-68121
    paths:
      - "usr/local/bin/gosu"
    statement: "Go standard library inside /usr/local/bin/gosu of the official postgres image, used once at container start to drop privileges before exec'ing postgres; it opens no network connection and parses no input. postgres:18.6-alpine3.24 is the newest tag (2026-11-06); update when the image ships a gosu built with a fixed Go."
    expired_at: 2026-12-07
