  # Alpine packages of the pulled base images nginx:1.30.6-alpine3.24 (pushed 2026-11-06) and postgres:18.6-alpine3.24
  # (re-pushed 2026-11-11), both still on Alpine 3.24.3 packages while Alpine has published the fixes. Reviewed 2026-11-12:
  # no newer tag exists for either. The images this project builds (docker/nginx/Dockerfile, docker/php/Dockerfile) run
  # `apk upgrade` and do not carry them. Before the expiry: check for new tags, or build thin images with `apk upgrade`
  # for postgres and the development nginx (a decision for step 5-2 or later).
